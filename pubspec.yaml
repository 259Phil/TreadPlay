name: treadplay
description: "Treadplay – walk with a companion."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  geolocator: 14.0.2
  go_router: ^17.2.3
  google_mobile_ads: ^7.0.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  pedometer: ^4.2.0
  permission_handler: ^13.0.2
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/companions/
    - assets/kits/
    - assets/pouch/
    - assets/icons/
    - assets/brand/
    - assets/worlds/
    - assets/wanderweg/
    - assets/seals/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon_1024.png
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/brand/app_icon_1024.png
