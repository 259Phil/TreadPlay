name: treadplay
description: "TreadPlay – walk with a companion."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  geolocator: 14.0.2
  go_router: ^17.2.3
  google_mobile_ads: ^7.0.0
  intl: ^0.20.2
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  pedometer: ^4.2.0
  permission_handler: ^12.0.3
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/companions/
    - assets/kits/
    - assets/pouch/
    - assets/icons/
    - assets/brand/
    - assets/worlds/
    - assets/wanderweg/
    - assets/seals/
    - assets/leash/
    - assets/nav/
    - assets/backdrop/
    - assets/npc/
    - assets/forge/
    - assets/items/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700
    - family: BarlowSemiCondensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700
    - family: AlegreyaSC
      fonts:
        - asset: assets/fonts/AlegreyaSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/AlegreyaSC-Bold.ttf
          weight: 700
    - family: Metamorphous
      fonts:
        - asset: assets/fonts/Metamorphous-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon_1024.png
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/brand/app_icon_1024.png
